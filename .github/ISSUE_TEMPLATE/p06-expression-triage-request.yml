﻿name: "[P06] n8n expression triage request (sanitized)"
description: "Public expression help request. Do not paste tokens/PII."
title: "[P06] n8n expression triage: <short error>"
labels: ["p06", "n8n", "public-lead"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the **P06 n8n Expression 报错排查助手（离线）**.

        Important:
        - This is a **public** issue. Do **not** paste credentials/tokens/PII, internal URLs, customer names, etc.
        - Prefer sharing only: error message + expression snippet + minimal upstream JSON shape.
        - I can reply with: likely causes + fix suggestions + a safe-share checklist.

  - type: input
    id: n8n_version
    attributes:
      label: n8n version (optional)
      placeholder: "e.g. 1.70.0"
    validations:
      required: false

  - type: dropdown
    id: node_context
    attributes:
      label: Where is the expression used?
      options:
        - "Set / Edit Fields"
        - "IF"
        - "HTTP Request"
        - "Code"
        - "Merge"
        - "Split In Batches"
        - "Loop Over Items"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: Error message (copy/paste)
      placeholder: "TypeError: Cannot read properties of undefined (reading 'toString')"
      render: text
    validations:
      required: true

  - type: textarea
    id: expression
    attributes:
      label: Expression snippet (sanitized)
      description: "Paste only the expression. Replace IDs/URLs/tokens with placeholders."
      render: text
    validations:
      required: true

  - type: textarea
    id: minimal_json_shape
    attributes:
      label: Minimal upstream $json shape (sanitized)
      description: "Example: {\"customer\": {\"email\": \"REDACTED\"}, \"items\": [{\"id\": 1}] }"
      render: json
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: "I confirmed there are no credentials/tokens/PII in this issue."
          required: true
        - label: "I understand this issue is public and indexed."
          required: true
